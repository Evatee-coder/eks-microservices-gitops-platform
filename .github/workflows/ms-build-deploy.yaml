---
name: ms build and deploy

on:
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'class11-12/app**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 216989097838.dkr.ecr.us-east-1.amazonaws.com
  environment_branch: prod

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            ecr_repo: prod-craftica-frontend
          - name: catalogue
            ecr_repo: prod-craftica-catalogue
          - name: voting
            ecr_repo: prod-craftica-voting
          - name: recommendation
            ecr_repo: prod-craftica-recco

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # with:
        #   token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::216989097838:role/eks-github-actions-build-role
          role-session-name: GitHub_to_AWS_OIDC_MS
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ./microservices-k8s/app/${{ matrix.service.name }}
          file: ./microservices-k8s/app/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service.ecr_repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


