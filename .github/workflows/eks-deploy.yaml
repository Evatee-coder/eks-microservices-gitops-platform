# Manual deploy --> multi-env deployment workflow for EKS 
name: EKS Infra Deploy


on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      apply_or_delete:
        description: 'Apply or Delete'
        required: false
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy
      path:
        description: 'Path to eks infra code'
        required: false
        default: 'eks-proper-infra/infra'
        type: string
env:
  TF_VERSION: 1.13.1
  AWS_REGION: us-east-1
  

jobs:
  infra-deploy:
    name: EKS Infra Deploy
    runs-on: ubuntu-latest   
    permissions:
      id-token: write
      contents: read   

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::216989097838:role/eks-github-actions-build-role # copied d arn from "eks-github-actions-build-role" role in IAM
          role-session-name: GitHub_to_AWS_OIDC_EKSDEP
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ github.event.inputs.path }}
        run: terraform init -backend-config=vars/${{ github.event.inputs.environment }}.tfbackend

      - name: Terraform Apply
        if: ${{ github.event.inputs.apply_or_delete == 'apply' }}
        working-directory: ${{ github.event.inputs.path }}
        run: terraform apply -auto-approve -var-file=vars/${{ github.event.inputs.environment }}.tfvars

      - name: Terraform Destroy
        if: ${{ github.event.inputs.apply_or_delete == 'destroy' }}
        working-directory: ${{ github.event.inputs.path }}
        run: terraform destroy -auto-approve -var-file=vars/${{ github.event.inputs.environment }}.tfvars